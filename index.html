    ];

    // Load Products
    async function loadProducts() {
        try {
            const res = await fetch('products.json');
            if (!res.ok) throw new Error("Could not fetch file");
            productsData = await res.json();
        } catch (err) {
            productsData = FALLBACK_PRODUCTS;
        }
        updateWishlistBadge();
        renderAllViews();
    }

    // Wishlist / Favorites Logic
    function toggleWishlist(id) {
        if (wishlist.includes(id)) {
            wishlist = wishlist.filter(item => item !== id);
        } else {
            wishlist.push(id);
        }
        localStorage.setItem('userWishlist', JSON.stringify(wishlist));
        updateWishlistBadge();
        renderAllViews();
    }

    function updateWishlistBadge() {
        document.getElementById('wishlistBadge').innerText = wishlist.length;
    }

    // Tab Switching Logic
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('bg-amber-800', 'border-amber-400');
            btn.classList.add('text-amber-200');
        });
        
        const activeTab = document.getElementById(`tab-${tabId}`);
        const activeNav = document.getElementById(`nav-${tabId}`);
        
        if (activeTab) activeTab.classList.add('active');
        if (activeNav) {
            activeNav.classList.add('bg-amber-800', 'border-amber-400');
            activeNav.classList.remove('text-amber-200');
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Create Product Card HTML (Includes Heart Icon for Wishlist)
    function createProductCard(p) {
        const isFav = wishlist.includes(p.id);
        return `
            <div class="bg-white rounded-xl shadow-sm border border-amber-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition transform hover:-translate-y-1 relative">
                <div>
                    <div class="relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-44 object-cover">
                        ${p.subCategory ? `<span class="absolute top-2 left-2 bg-amber-800 text-amber-100 font-bold text-[10px] px-2 py-0.5 rounded shadow">${p.subCategory}</span>` : ''}
                        <span class="absolute top-2 right-2 bg-gray-900/90 text-amber-300 font-mono text-[10px] px-2 py-0.5 rounded font-bold">${p.id}</span>
                        
                        <!-- Heart / Wishlist Button -->
                        <button onclick="toggleWishlist('${p.id}')" class="absolute bottom-2 right-2 w-8 h-8 rounded-full bg-white/90 shadow flex items-center justify-center transition hover:scale-110">
                            <i class="${isFav ? 'fa-solid text-rose-500' : 'fa-regular text-gray-400'} fa-heart text-sm"></i>
                        </button>
                    </div>
                    <div class="p-3">
                        <span class="text-[10px] uppercase tracking-wider text-amber-700 font-bold">${p.category}</span>
                        <h3 class="font-bold text-gray-800 text-sm mt-0.5 line-clamp-1">${p.name}</h3>
                        <p class="text-amber-900 font-bold mt-1 text-sm">${p.price}</p>
                    </div>
                </div>
                <div class="p-3 pt-0 flex gap-2">
                    <button onclick="addToCart('${p.id}')" class="flex-1 bg-amber-800 hover:bg-amber-900 text-white text-xs py-2 rounded-lg font-semibold transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-cart-plus"></i> Add
                    </button>
                    <a href="https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(p.id)}" 
                       target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-xs transition flex items-center justify-center" title="Inquire on WhatsApp">
                        <i class="fa-brands fa-whatsapp text-base"></i>
                    </a>
                </div>
            </div>
        `;
    }

    // Render Views across sections
    function renderAllViews() {
        const dhotis = productsData.filter(p => p.category === 'Dhoti');
        const saaj = productsData.filter(p => p.category === 'Saaj');
        const sanjab3 = productsData.filter(p => p.category === 'Sanjab' && p.subCategory === '3 Inch');
        const sanjab5 = productsData.filter(p => p.category === 'Sanjab' && p.subCategory === '5 Inch');
        
        // Home Screen - 4 New Arrivals per category
        document.getElementById('homeDhotiGrid').innerHTML = dhotis.filter(p => p.isNewArrival).slice(0, 4).map(createProductCard).join('');
        document.getElementById('homeSaajGrid').innerHTML = saaj.filter(p => p.isNewArrival).slice(0, 4).map(createProductCard).join('');
        
        const sanjabHomeNew = [...sanjab3.filter(p => p.isNewArrival), ...sanjab5.filter(p => p.isNewArrival)].slice(0, 4);
        document.getElementById('homeSanjabGrid').innerHTML = sanjabHomeNew.map(createProductCard).join('');

        // Respective Category Sections
        document.getElementById('dhotiGrid').innerHTML = dhotis.map(createProductCard).join('');
        document.getElementById('saajGrid').innerHTML = saaj.map(createProductCard).join('');
        document.getElementById('sanjab3Grid').innerHTML = sanjab3.map(createProductCard).join('');
        document.getElementById('sanjab5Grid').innerHTML = sanjab5.map(createProductCard).join('');

        // Wishlist Tab
        const favProducts = productsData.filter(p => wishlist.includes(p.id));
        const wishlistContainer = document.getElementById('wishlistGrid');
        if (favProducts.length === 0) {
            wishlistContainer.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">No items saved to your favorites yet. Click the heart icon on any product to save it here!</p>`;
        } else {
            wishlistContainer.innerHTML = favProducts.map(createProductCard).join('');
        }
    }

    // Live Search Handling
    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const resultsSection = document.getElementById('searchResultsSection');
        const searchGrid = document.getElementById('searchGrid');

        if (!query) {
            resultsSection.classList.add('hidden');
            return;
        }

        const matches = productsData.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.id.toLowerCase().includes(query) || 
            p.category.toLowerCase().includes(query) ||
            (p.subCategory && p.subCategory.toLowerCase().includes(query))
        );

        resultsSection.classList.remove('hidden');
        searchGrid.innerHTML = matches.length > 0 
            ? matches.map(createProductCard).join('') 
            : `<p class="col-span-full text-center text-gray-500 py-6">No products found matching "${query}".</p>`;
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResultsSection').classList.add('hidden');
    }

    // Cart Actions
    function toggleCart() {
        document.getElementById('cartDrawer').classList.toggle('translate-x-full');
    }

    function addToCart(id) {
        if (!cart.includes(id)) {
            cart.push(id);
        }
        updateCartUI();
        toggleCart();
    }

    function removeFromCart(id) {
        cart = cart.filter(itemId => itemId !== id);
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cartBadge').innerText = cart.length;
        const container = document.getElementById('cartItems');
        
        if (cart.length === 0) {
            container.innerHTML = `<p class="text-center text-gray-500 py-8">Your cart is empty.</p>`;
            return;
        }

        const cartProducts = cart.map(id => productsData.find(p => p.id === id)).filter(Boolean);

        container.innerHTML = cartProducts.map(item => `
            <div class="flex items-center justify-between bg-amber-50 p-3 rounded-lg border border-amber-100">
                <div>
                    <span class="font-mono text-[10px] font-bold text-amber-800 bg-amber-200/60 px-1.5 py-0.5 rounded">${item.id}</span>
                    <h4 class="font-bold text-xs text-gray-800 mt-1">${item.name}</h4>
                    <p class="text-[10px] text-gray-500">${item.category} | ${item.price}</p>
                </div>
                <button onclick="removeFromCart('${item.id}')" class="text-red-600 hover:text-red-800 text-xs font-bold">Remove</button>
            </div>
        `).join('');
    }

    function checkoutCartWhatsApp() {
        if (cart.length === 0) {
            alert('Your cart is empty!');
            return;
        }
        const draftMsg = "Hello, I want to inquire about these Product IDs: " + cart.join(', ');
        window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(draftMsg)}`, '_blank');
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
