media: images
content:
  - name: products
    label: Products Catalog
    file: products.json
    fields:
      - name: id
        label: Product ID
        type: string
        required: true
      - name: name
        label: Product Name
        type: string
        required: true
      - name: category
        label: Category Name
        type: string
        required: true
      - name: price
        label: Price
        type: string
        required: true
      - name: image
        label: Product Image
        type: image
        required: true
